name: Docker Image CI

on:
  push:
    branches: [ "harbor-base" ]
  pull_request:
    branches: [ "harbor-base" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag harbor-ai.eoffcn.com/hub/alpine:3.23
    - name: Log in to GitHub container registry
      uses: docker/login-action@v1
      with:
        registry: ${{ secrets.HARBOR_URL }}
        username: ${{ secrets.HARBOR_NAME }}
        password: ${{ secrets.HARBOR_PASSWD }}
    - name: Push the Docker image
      run: docker push harbor-ai.eoffcn.com/hub/alpine:3.23
